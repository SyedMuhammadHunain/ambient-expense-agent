<div class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-lg">
    <!-- Header Card -->
    <div class="bg-white/80 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
      <!-- Gradient Header -->
      <div class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 px-8 py-6">
        <h1 class="text-2xl font-bold text-white tracking-tight">Expense Approval</h1>
        <p class="text-indigo-100 text-sm mt-1">Review and action pending HITL expense requests</p>
      </div>

      <!-- Body -->
      <div class="px-8 py-6 space-y-5">
        <!-- Session ID -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Session ID</label>
          <input
            type="text"
            [value]="sessionId()"
            (input)="updateSessionId($event)"
            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
            placeholder="e.g. test-sub"
          />
        </div>

        <!-- User ID -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">User ID</label>
          <input
            type="text"
            [value]="userId()"
            (input)="updateUserId($event)"
            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
            placeholder="e.g. default"
          />
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-3 pt-2">
          <button
            (click)="approve()"
            [disabled]="isLoading()"
            class="flex-1 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 disabled:opacity-50 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-200 shadow-lg shadow-green-500/25 hover:shadow-green-500/40 cursor-pointer disabled:cursor-not-allowed"
          >
            @if (isLoading()) {
              <span class="inline-block animate-spin mr-2">⏳</span>
            }
            Approve
          </button>
          <button
            (click)="reject()"
            [disabled]="isLoading()"
            class="flex-1 bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 disabled:opacity-50 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-200 shadow-lg shadow-red-500/25 hover:shadow-red-500/40 cursor-pointer disabled:cursor-not-allowed"
          >
            @if (isLoading()) {
              <span class="inline-block animate-spin mr-2">⏳</span>
            }
            Reject
          </button>
        </div>

        <!-- Status Output -->
        @if (status()) {
          <div class="mt-2 p-4 bg-gray-900 rounded-xl text-sm font-mono text-green-400 break-all border border-gray-700 shadow-inner">
            <span class="text-gray-500 select-none">› </span>{{ status() }}
          </div>
        }
      </div>

      <!-- Footer -->
      <div class="px-8 py-4 bg-gray-50/50 border-t border-gray-100">
        <p class="text-xs text-gray-400 text-center">Ambient Expense Agent — Human-in-the-Loop Approval UI</p>
      </div>
    </div>
  </div>
</div>
